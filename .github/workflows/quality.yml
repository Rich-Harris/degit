name: Quality

on:
    pull_request:
    push:
        branches: [master]

jobs:
    quality:
        name: Quality
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5

            - uses: nubjs/setup-nub@v0

            - run: nub --version

            - name: Use Node.js LTS
              uses: actions/setup-node@v5
              with:
                  node-version: lts/*

            - run: nub ci
            - run: nub run lint:ci
            - run: nub run format:ci
            - run: nub run duplicates:ci
            - run: nub run knip:ci
            - run: nub run typecheck
