name: Verification

on:
    pull_request:
    push:
        branches: [master]

jobs:
    verification:
        name: Verification (${{ matrix.os }})

        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]

        steps:
            - uses: actions/checkout@v5

            - uses: nubjs/setup-nub@v0

            - run: nub --version

            - name: Use Node.js 20.x
              uses: actions/setup-node@v5
              with:
                  node-version: 20.x

            - run: nub ci
            - run: nub run build
            - run: nub run test
